          curl -fsS -X POST "https://tdvjswuggnusoqosltxa.supabase.co/functions/v1/registrar-visita" \
            -H "Content-Type: application/json" \
            -H "apikey: sb_publishable_D3nOZGWJ0c6xDdNQxiCafA_3sN8ckSY" \
            -d '{"ping":true}'
